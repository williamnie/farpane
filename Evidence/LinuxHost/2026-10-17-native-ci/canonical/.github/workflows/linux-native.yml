name: Linux native candidate

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Public HTTPS URL of the complete pinned Linux source snapshot
        required: true
        type: string
      source_sha256:
        description: SHA-256 of that source archive
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: linux-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out Linux build entrypoints
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false

      - name: Build, test and package the complete native application
        env:
          NATIVE_SOURCE_URL: ${{ inputs.source_url }}
          NATIVE_SOURCE_SHA256: ${{ inputs.source_sha256 }}
          NATIVE_RUN_ID: ${{ github.run_id }}
          NATIVE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 -B Scripts/linux/ci-native-source.py \
            --source-url "$NATIVE_SOURCE_URL" --sha256 "$NATIVE_SOURCE_SHA256" \
            --version "0.1.0~ci.${NATIVE_RUN_ID}.${NATIVE_RUN_ATTEMPT}" \
            --output Build/Linux/native-ci/run

      - name: Upload verified candidate and source inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: farpane-linux-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: Build/Linux/native-ci/run/deliverables/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Preserve pipeline logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: farpane-linux-native-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Build/Linux/native-ci/run/*.json
            Build/Linux/native-ci/run/*.stdout
            Build/Linux/native-ci/run/*.stderr
          if-no-files-found: ignore
          retention-days: 14
