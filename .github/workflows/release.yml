name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-release:
    name: Verify tag and create prerelease
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Resolve tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$DISPATCH_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi
          [[ "$tag" == v* ]] || { printf '%s\n' 'release tag must start with v' >&2; exit 2; }
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Validate shell scripts
        run: find Scripts -type f -name '*.sh' -print0 | xargs -0 -n 1 zsh -n

      - name: Run Python script tests
        run: python3 -m unittest discover -s Tests/ScriptTests -p 'test_*.py'

      - name: Run Swift tests
        run: swift test

      - name: Build release viewer
        run: swift build -c release

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf 'Release %s already exists\n' "$RELEASE_TAG"
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --generate-notes \
            --title "FarPane $RELEASE_TAG"
