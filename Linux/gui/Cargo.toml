[package]
name = "farpane-gui"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-only"

[[bin]]
name = "farpane"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "=0.10.1", features = ["v4_14"] }
adw = { package = "libadwaita", version = "=0.8.0", features = ["v1_5"] }
farpane-protocol = { path = "../native/protocol" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.118"
libc = "=0.2.171"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true

[workspace]
